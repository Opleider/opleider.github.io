<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0e9">
  <meta name="description" content="A little corner of the internet belonging to Opleider.">
  <title>Opleider — Hello, internet.</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f0e9;
      --ink: #193c35;
      --accent: #c34c32;
      --muted: #66746c;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 32px clamp(24px, 6vw, 88px) 24px;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-family: "Trebuchet MS", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .wordmark { font-weight: 700; }
    .header-note, footer { color: var(--muted); }

    main {
      display: grid;
      flex: 1;
      align-content: center;
      justify-items: start;
      padding: 72px 0 88px;
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--accent);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(64px, 12vw, 160px);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.92;
    }

    .intro {
      max-width: 390px;
      margin: 32px 0 0;
      color: var(--muted);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    .rule {
      width: 100%;
      height: 1px;
      margin-top: 56px;
      background: color-mix(in srgb, var(--ink) 24%, transparent);
    }

    footer { font-size: 11px; }

    @media (max-width: 520px) {
      .page { padding-top: 24px; }
      .header-note { text-align: right; }
      main { padding: 64px 0; }
      .intro { max-width: 320px; }
      footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="wordmark">Opleider</span>
      <span class="header-note">A little corner of the internet</span>
    </header>
    <main>
      <p class="eyebrow">Welcome</p>
      <h1>Hello,<br>internet.</h1>
      <p class="intro">You found Opleider's home on the web. There isn't much here yet, but it's a start.</p>
      <div class="rule" aria-hidden="true"></div>
    </main>
    <footer>
      <span>Opleider</span>
      <span>More to come.</span>
    </footer>
  </div>
</body>
</html>
